version: '3.8'

services:
  wms-app:
    build: .
    container_name: 1-6-26
    ports:
      - "8501:8501"
    volumes:
      # Maps the local ./data folder to the container's /app/data folder
      # This makes warehouse.db persistent across restarts.
      - ./data:/app/data
      # Mount the image so the script can encode it for the background
      - ./nebula_bg.jpg:/app/nebula_bg.jpg
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped